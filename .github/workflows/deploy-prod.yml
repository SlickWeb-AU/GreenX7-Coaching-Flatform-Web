name: Deploy Frontend (Production)

# Production Sydney — https://coaching.greenx7.com
#
# Merge develop vào main => build image => DỪNG chờ duyệt (environment "prod",
# required reviewers) => duyệt xong mới deploy.
# Rollback: Actions → "Deploy Frontend (Production)" → Run workflow trên main,
# điền tag (SHA rút gọn) của bản cũ => bỏ qua build, vẫn phải duyệt.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag image đã có (SHA rút gọn) để deploy/rollback. Để trống = build từ commit hiện tại'
        required: false
        default: ''

concurrency:
  # Không cho 2 lần deploy prod chạy chồng lên nhau
  group: deploy-prod-web
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SITE_URL: https://coaching.greenx7.com

jobs:
  build-and-push:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Tính tag và tên image
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ github.repository_owner }}/greenx7-web' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_GREENX7_URL=${{ vars.NEXT_PUBLIC_GREENX7_URL || 'https://www.greenx7.com' }}
          # Chỉ gắn tag SHA: tag "latest" để dành cho dev
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Chạy cả khi build bị bỏ qua (rollback theo tag có sẵn)
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    # Environment "prod": chỉ nhận branch main, bắt buộc có người duyệt
    environment:
      name: prod
      url: https://coaching.greenx7.com
    permissions:
      contents: read
      packages: read

    steps:
      - id: tag
        name: Chọn tag cần deploy
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          TAG="${INPUT_TAG:-$BUILT_TAG}"
          # Tag đi vào lệnh chạy trên server => chỉ nhận SHA hex, chặn chèn lệnh
          if ! [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "❌ Tag không hợp lệ: '$TAG'"
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "==> Deploy web tag $TAG"

      - name: Kiểm tra image có trên GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}/greenx7-web' | tr '[:upper:]' '[:lower:]'):${{ steps.tag.outputs.value }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "$IMAGE" > /dev/null || { echo "❌ Không thấy image $IMAGE"; exit 1; }

      - name: SSH vào prod và cập nhật web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/greenx7

            # Đăng nhập GHCR bằng token tạm của lần chạy này, trong thư mục cấu hình docker
            # riêng rồi xoá: không ghi đè thông tin đăng nhập lâu dài đang có trên server.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Đang chạy: $(grep -E '^WEB_TAG=' .env)"
            sed -i "s|^WEB_TAG=.*|WEB_TAG=${{ steps.tag.outputs.value }}|" .env

            # deploy.sh: pull, up, chờ healthy, reload nginx, dọn image cũ
            ./deploy.sh web

      - name: Kiểm tra site qua domain
        run: |
          for path in /login /api/health /backend/health; do
            for i in $(seq 1 6); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path" || true)
              if [ "$CODE" = "200" ]; then echo "✅ $path 200"; continue 2; fi
              sleep 5
            done
            echo "❌ $path trả $CODE"
            exit 1
          done
